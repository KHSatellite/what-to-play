[project]
name = "fastapi-ogrenme"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "hanbabakadir", email = "hanbaba.kadir@hotmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "psycopg2-binary>=2.9.12",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.0.52",
]

[project.scripts]
fastapi-ogrenme = "fastapi_ogrenme:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "requests>=2.34.2",
]
